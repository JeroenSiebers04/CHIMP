<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Testtool Frontend</title>
    <link rel="stylesheet" href="..\\style\\style.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script>
        function showTab(tabIdOrButton) {
            // Accept either a tabId string or the button element that was clicked
            var tabId = typeof tabIdOrButton === 'string' ? tabIdOrButton : tabIdOrButton.getAttribute('data-tab');

            document.querySelectorAll('.tab-content').forEach(function(el){
                el.style.display = 'none';
                el.setAttribute('aria-hidden', 'true');
            });

            var panel = document.getElementById(tabId);
            if (panel) {
                panel.style.display = 'block';
                panel.setAttribute('aria-hidden', 'false');
            }

            document.querySelectorAll('.tab-button').forEach(function(b){
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });

            var btn = typeof tabIdOrButton === 'string' ? document.querySelector('[data-tab="'+tabIdOrButton+'"]') : tabIdOrButton;
            if (btn) {
                btn.classList.add('active');
                btn.setAttribute('aria-selected', 'true');
            }
        }

        function validateAndSubmit(form) {
            const err = document.getElementById('form-error');
            if (err) err.textContent = '';

            const checked = Array.from(form.querySelectorAll('input[name="scripts"]')).some(function(cb){ return cb.checked; });
            if (!checked) {
                if (err) {
                    err.textContent = 'Kies minimaal één testscript voordat u de tests start.';
                    err.style.display = 'block';
                } else {
                    alert('Kies minimaal één testscript voordat u de tests start.');
                }
                return false; 
            }
            return true;
        }

        window.addEventListener('DOMContentLoaded', function(){
            const first = document.querySelector('.tab-button');
            if(first) showTab(first);
        });
    </script>
</head>
<body>
    <h1>CHIMP Testtool</h1>
    <div class="tabbar" role="tablist" aria-label="Test categories">
        {% for tab, mapping in tabs.items() %}
            <button type="button" class="tab-button" role="tab" aria-controls="tab-{{ loop.index }}" data-tab="tab-{{ loop.index }}" onclick="showTab(this)">{{ tab }}</button>
        {% endfor %}
    </div>

    <form action="/run" method="POST" onsubmit="return validateAndSubmit(this);">
        {% for tab, mapping in tabs.items() %}
            <div id="tab-{{ loop.index }}" class="tab-content" role="tabpanel" aria-labelledby="tab-{{ loop.index }}-button" aria-hidden="true" style="display:none">
                <h2>{{ tab }}</h2>
                {% if mapping %}
                    {% for name, path in mapping.items() %}
                        <div class="script-row" style="margin-bottom:.5rem;">
                            <label style="margin-right:.5rem;">
                                <input type="checkbox" name="scripts" value="{{ name }}" onchange="toggleControls(this)">
                                {{ name }}
                            </label>
                            <!-- per-script amount input and run button (hidden until checkbox is checked) -->
                            <input id="amount-{{ loop.index }}-{{ loop.index0 }}" name="amount-{{ loop.index }}-{{ loop.index0 }}" type="number" min="1" placeholder="200" style="width:6rem;margin-left:.5rem;display:none;">
                            <button type="button" onclick="runWithAmount('{{ name|e }}','amount-{{ loop.index }}-{{ loop.index0 }}','result-{{ loop.index }}-{{ loop.index0 }}')" style="margin-left:.5rem;display:none;">Run</button>
                            <div id="result-{{ loop.index }}-{{ loop.index0 }}" class="script-result" style="margin-top:.25rem; white-space:pre-wrap; font-family:monospace; display:none;"></div>
                        </div>
                    {% endfor %}
                {% else %}
                    <p>Geen scripts beschikbaar voor deze categorie.</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Start geselecteerde tests</button>
    </form>

    <script>
        async function runWithAmount(scriptName, amountId, resultId) {
            const amountEl = document.getElementById(amountId);
            const resultEl = document.getElementById(resultId);
            if (!amountEl) return alert('Amount input not found');
            const amount = amountEl.value;
            const form = new FormData();
            form.append('script', scriptName);
            form.append('amount', amount);

            resultEl.textContent = 'Running...';
            try {
                const resp = await fetch('/run_with_amount', { method: 'POST', body: form });
                const data = await resp.json();
                if (!resp.ok) {
                    resultEl.textContent = JSON.stringify(data, null, 2);
                    return;
                }
                // Prefer stdout if present
                if (data.stdout) {
                    resultEl.textContent = data.stdout;
                } else if (data.result) {
                    resultEl.textContent = String(data.result);
                } else {
                    resultEl.textContent = JSON.stringify(data, null, 2);
                }
            } catch (err) {
                resultEl.textContent = String(err);
            }
        }
    </script>
    <script>
        // Toggle visibility of per-script controls (amount input, run button, result)
        function toggleControls(checkbox) {
            const row = checkbox.closest('.script-row');
            if (!row) return;
            const amountEl = row.querySelector('input[type="number"]');
            const btn = row.querySelector('button');
            const resultEl = row.querySelector('.script-result');
            if (checkbox.checked) {
                if (amountEl) amountEl.style.display = 'inline-block';
                if (btn) btn.style.display = 'inline-block';
                if (resultEl) resultEl.style.display = 'block';
            } else {
                if (amountEl) amountEl.style.display = 'none';
                if (btn) btn.style.display = 'none';
                if (resultEl) {
                    resultEl.style.display = 'none';
                    resultEl.textContent = '';
                }
            }
        }

        // Ensure initial visibility of controls matches checkbox state
        window.addEventListener('DOMContentLoaded', function(){
            document.querySelectorAll('.script-row input[type="checkbox"]').forEach(function(cb){
                toggleControls(cb);
            });
        });
    </script>
</body>
</html>
