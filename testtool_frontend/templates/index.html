<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Testtool Frontend</title>
    <link rel="stylesheet" href="..\\style\\style.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <script>
        function showTab(tabIdOrButton) {
            // Accept either a tabId string or the button element that was clicked
            var tabId = typeof tabIdOrButton === 'string' ? tabIdOrButton : tabIdOrButton.getAttribute('data-tab');

            document.querySelectorAll('.tab-content').forEach(function(el){
                el.style.display = 'none';
                el.setAttribute('aria-hidden', 'true');
            });

            var panel = document.getElementById(tabId);
            if (panel) {
                panel.style.display = 'block';
                panel.setAttribute('aria-hidden', 'false');
            }

            document.querySelectorAll('.tab-button').forEach(function(b){
                b.classList.remove('active');
                b.setAttribute('aria-selected', 'false');
            });

            var btn = typeof tabIdOrButton === 'string' ? document.querySelector('[data-tab="'+tabIdOrButton+'"]') : tabIdOrButton;
            if (btn) {
                btn.classList.add('active');
                btn.setAttribute('aria-selected', 'true');
            }
        }

        function validateAndSubmit(form) {
            const err = document.getElementById('form-error');
            if (err) err.textContent = '';

            const checked = Array.from(form.querySelectorAll('input[name="scripts"]')).some(function(cb){ return cb.checked; });
            if (!checked) {
                if (err) {
                    err.textContent = 'Kies minimaal één testscript voordat u de tests start.';
                    err.style.display = 'block';
                } else {
                    alert('Kies minimaal één testscript voordat u de tests start.');
                }
                return false; 
            }
            return true;
        }

        window.addEventListener('DOMContentLoaded', function(){
            const first = document.querySelector('.tab-button');
            if(first) showTab(first);
        });
    </script>
</head>
<body>
    <h1>CHIMP Testtool</h1>
    <div class="tabbar" role="tablist" aria-label="Test categories">
        {% for tab, mapping in tabs.items() %}
            <button type="button" class="tab-button" role="tab" aria-controls="tab-{{ loop.index }}" data-tab="tab-{{ loop.index }}" onclick="showTab(this)">{{ tab }}</button>
        {% endfor %}
    </div>

    <form action="/run" method="POST" onsubmit="return validateAndSubmit(this);">
        {% for tab, mapping in tabs.items() %}
            <div id="tab-{{ loop.index }}" class="tab-content" role="tabpanel" aria-labelledby="tab-{{ loop.index }}-button" aria-hidden="true" style="display:none">
                <h2>{{ tab }}</h2>
                {% if mapping %}
                    {% for name, path in mapping.items() %}
                        <label>
                            <input type="checkbox" name="scripts" value="{{ name }}">
                            {{ name }}
                        </label>
                    {% endfor %}
                {% else %}
                    <p>Geen scripts beschikbaar voor deze categorie.</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit">Start geselecteerde tests</button>
    </form>
</body>
</html>
